name: Refresh IND JWT Tokens

on:
  schedule:
    # GitHub Actions cron is UTC. This runs every 8 hours.
    - cron: "0 */8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Refresh all IND tokens
        env:
          JWT_API_URL: https://jwt-token-gen-api-one.vercel.app/token
          JWT_API_METHOD: ${{ vars.JWT_API_METHOD || 'GET' }}
          JWT_API_TIMEOUT: ${{ vars.JWT_API_TIMEOUT || '60' }}
          JWT_API_DELAY: ${{ vars.JWT_API_DELAY || '0.15' }}
        run: python refresh_tokens.py

      - name: Commit refreshed token_ind.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add token_ind.json
          if git diff --cached --quiet; then
            echo "No token changes to commit."
            exit 0
          fi
          git commit -m "Auto refresh IND tokens"
          git push
